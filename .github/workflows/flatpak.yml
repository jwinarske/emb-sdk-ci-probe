# Generated by `emb init flatpak` (emb 0.7.0-dev).
#
# Builds the flatpak natively on the runner. Deliberately plain: no
# caching, one job. Add what your project needs.
name: flatpak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The build runs code from the embedder, the app and the Flutter SDK.
# None of it needs to write to this repo.
permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
      # cmake and ninja build the embedder, clang, lld and llvm compile
      # it against the flatpak SDK, whose libraries it links, so no
      # -dev packages are needed. libsystemd-dev is for a native
      # dependency of emb itself.
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder binutils \
            cmake ninja-build libsystemd-dev clang lld llvm \
            libpugixml-dev  # PROBE: the host scanner's build dep
      # flatpak-builder runs each build command in a bwrap sandbox, which
      # needs unprivileged user namespaces. The runner's AppArmor denies
      # them by default.
      - name: Allow the flatpak-builder sandbox
        run: >
          sudo sysctl -w
          kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the flatpak runtime
        run: |
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08
      - name: Install emb
        # Generated by an unreleased emb (0.7.0-dev), which pub.dev does
        # not have. Replace with a release once one carries `emb init`:
        #   dart pub global activate emb_cli <version>
        run: >
          dart pub global activate --source git
          https://github.com/toyota-connected/emb_cli.git
      # PROBE: extending source#flatpak-sdk-x86_64 resolves every target in
      # ivi-homescreen's .emb/, and its board targets extend the board library.
      - name: Fetch emb's board library
        run: emb boards sync
      - name: Build the flatpak
        run: >
          emb cross emb-sdk-ci-probe.emb.yaml --target sdk-x86_64 --build
          --flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: >-
            workspace/.config/flutter_workspace/cross-build-*/dist/*.flatpak
          if-no-files-found: error
