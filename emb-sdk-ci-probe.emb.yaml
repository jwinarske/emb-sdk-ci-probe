# Generated by `emb init flatpak` (emb 0.7.0-dev).
#
# Everything the build needs is named here. The embedder and the app are
# cloned into the workspace below and the Flutter SDK is installed into
# it, so this directory is the whole packaging repo:
#
#   emb cross emb-sdk-ci-probe.emb.yaml --target local --build --flatpak
id: emb-sdk-ci-probe
type: app
workspace: workspace               # relative to this file; git-ignored
flutter_version: stable            # a branch or a tag; pin a tag to stop it moving

cross:
  provider: arm-gnu                # required to parse; unused by --target local
  source:                          # the embedder
    uri: https://github.com/toyota-connected/ivi-homescreen.git
    rev: 0222f18cfe6bc3b156f55e429f4fdbb85ba8e2ce # v3.0 when generated
  app:                             # the Flutter app; --app <dir> still wins
    uri: https://github.com/jwinarske/emb-sdk-ci-probe.git
    rev: 20f52c853343cf3c8a00abdee9298f74787a77e2
    pubspec_path: app                # the app is in app/ of this repo
  package:
    name: emb-sdk-ci-probe
    version: '0.1.0'
    bin: shell/homescreen          # the embedder, relative to its build dir
    files:
      # AppStream metadata, installed under the flatpak prefix (/app).
      metainfo.xml: /share/metainfo/io.github.jwinarske.EmbSdkCiProbe.metainfo.xml
    flatpak:
      app_id: io.github.jwinarske.EmbSdkCiProbe
      name: 'emb SDK CI probe'     # the launcher's name
      icon: icon.png               # a placeholder; replace it
      runtime_version: '26.08'
  targets:
    # Built against the flatpak SDK rather than this machine: the host
    # clang and lld compile against org.freedesktop.Sdk for that
    # architecture, so the app runs on the runtime named above.
    # Each extends the embedder's own flatpak-sdk target, which
    # brings what it needs to build against the SDK. The provider is
    # named again, as the shared one above would otherwise win.
    sdk-x86_64:
      extends: 'source#flatpak-sdk-x86_64'
      provider: flatpak-sdk
      triple: x86_64-flatpak-linux-gnu
